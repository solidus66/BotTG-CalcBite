
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171717">
    <title>CalcBite</title>

    <link rel="stylesheet" href="./style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="./app.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="logo" aria-hidden="true">∑</div>
            <div>
                <h1>CalcBite</h1>
                <p class="subtitle">Калькулятор КБЖУ</p>
            </div>
            <button id="reset" class="reset-icon"
                    type="button" aria-label="Очистить поля"
                    title="Очистить поля">↺</button>
        </header>

        <section class="section">
            <h2>Пищевая ценность на 100 г</h2>

            <div class="fields">
                <label class="field">
                    <span>Калории</span>
                    <div class="input-wrap">
                        <input id="kcal" type="text" inputmode="decimal"
                               placeholder="0" autocomplete="off">
                        <span>ккал</span>
                    </div>
                </label>

                <label class="field">
                    <span>Белки</span>
                    <div class="input-wrap">
                        <input id="protein" type="text" inputmode="decimal"
                               placeholder="0" autocomplete="off">
                        <span>г</span>
                    </div>
                </label>

                <label class="field">
                    <span>Жиры</span>
                    <div class="input-wrap">
                        <input id="fat" type="text" inputmode="decimal"
                               placeholder="0" autocomplete="off">
                        <span>г</span>
                    </div>
                </label>

                <label class="field">
                    <span>Углеводы</span>
                    <div class="input-wrap">
                        <input id="carbs" type="text" inputmode="decimal"
                               placeholder="0" autocomplete="off">
                        <span>г</span>
                    </div>
                </label>
            </div>
        </section>

        <section class="section">
            <label class="field weight-field" for="weight">
                <span>Вес порции</span>
                <div class="input-wrap weight-wrap">
                    <input id="weight" type="text" inputmode="decimal"
                           placeholder="100" autocomplete="off">
                    <span>г</span>
                </div>
            </label>
        </section>

        <section class="result" aria-live="polite">
            <p class="result-caption">КБЖУ всей порции</p>
            <div class="calories">
                <span id="result-kcal">0</span>
                <span class="unit">ккал</span>
            </div>

            <div class="macros">
                <div class="macro">
                    <span class="macro-label">Белки</span>
                    <strong id="result-protein">0 г</strong>
                </div>
                <div class="macro">
                    <span class="macro-label">Жиры</span>
                    <strong id="result-fat">0 г</strong>
                </div>
                <div class="macro">
                    <span class="macro-label">Углеводы</span>
                    <strong id="result-carbs">0 г</strong>
                </div>
            </div>
        </section>

        <button id="clear" class="clear-button" type="button">
            Очистить поля
        </button>

        <p class="footer">CalcBite • Расчет КБЖУ на порцию</p>
    </main>
</body>
</html>
